name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行单元测试
        run: python -m unittest discover -p "test_*.py" -v

  build:
    name: 打包 ${{ matrix.builder }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: pyinstaller
          - builder: nuitka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller：产物更小、构建更快，但被杀软误报的概率较高
      - name: 打包（PyInstaller）
        if: matrix.builder == 'pyinstaller'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name RandomDraw random_draw.py

      # Nuitka：编译为原生代码，误报率显著低于 PyInstaller
      - name: 打包（Nuitka）
        if: matrix.builder == 'nuitka'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip nuitka
          python -m nuitka `
            --standalone `
            --onefile `
            --windows-disable-console `
            --enable-plugin=tk-inter `
            --assume-yes-for-downloads `
            --output-dir=build-nuitka `
            --output-filename=RandomDraw.exe `
            random_draw.py

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = if ("${{ matrix.builder }}" -eq 'pyinstaller') {
            'dist\RandomDraw.exe'
          } else {
            'build-nuitka\RandomDraw.exe'
          }
          if (-not (Test-Path $exe)) { throw "未找到产物: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "$exe - $([math]::Round($size / 1MB, 2)) MB"
          if ($size -lt 1MB) { throw "产物过小，可能打包失败" }

      - uses: actions/upload-artifact@v4
        with:
          name: RandomDraw-${{ matrix.builder }}
          path: ${{ matrix.builder == 'pyinstaller' && 'dist/RandomDraw.exe' || 'build-nuitka/RandomDraw.exe' }}
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建/更新 Release 并上传 exe 产物
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true